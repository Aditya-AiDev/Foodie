# Display the log of spring security
logging.level.org.springframework.security=DEBUG
# Prints the full logger name instead of abbreviated packages like o.s.s.a.dao --->> ctrl+n for classes and shift+shift for local files
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%logger){cyan} %clr(:){faint} %m%n







