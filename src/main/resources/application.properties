# JPA or hibernate configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true


spring.jpa.hibernate.ddl-auto=update
#1. none -- hibernate will not manage
#2. validate -- hibernate will validate schema against your entities but will not make any changes
#3. update -- hibernate will modify schema to match entity definitions but will not drop table
#4. create -- hibernate will create schema every time the application starts.
#5. create-drop -- similar to create, but schema is dropped automatically when application end

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#A dialect refers to the specific SQL variant that Hibernate uses to interact with a particular DB,
# Each DB has its own syntax and features, and Hibernate uses dialects to generate DB-specific SQL commands.


